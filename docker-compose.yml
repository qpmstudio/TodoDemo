services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tododemo
      POSTGRES_PASSWORD: tododemo
      POSTGRES_DB: tododemo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tododemo"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://tododemo:tododemo@db:5432/tododemo?sslmode=disable
      - up

  server:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://tododemo:tododemo@db:5432/tododemo?sslmode=disable
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      FRONTEND_URL: http://localhost:5173
      GITHUB_REDIRECT_URL: http://localhost:8080/auth/github/callback

volumes:
  pgdata:
