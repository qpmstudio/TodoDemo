# 基础由 ci_init.py 生成（.flow/ci.json → ci.yml）；setup-* 步骤与 diff-hygiene job 为手动追加，重新生成前请保留。
name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: go
        run: bash .flow/check.sh go
  frontend:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: frontend
        run: bash .flow/check.sh frontend
  # 手动追加（不随 .flow/ci.json 生成）：只在 PR 里报红，不进 required checks。
  diff-hygiene:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: diff hygiene
        run: bash .flow/check-diff-hygiene.sh
