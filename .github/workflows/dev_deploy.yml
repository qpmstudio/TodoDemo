name: Local K8s Deploy

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t tododemo:dev-latest .

      - name: Deploy to K8s
        run: kubectl apply -f deploy/k8s/ -n tododemo-dev

      - name: Wait for Rollout
        run: kubectl rollout status deployment/tododemo -n tododemo-dev --timeout=120s

      - name: Health Check
        run: |
          kubectl port-forward -n tododemo-dev svc/tododemo 8080:8080 &
          PF_PID=$!
          sleep 2
          curl -s --retry 5 --retry-connrefused http://localhost:8080/health
          kill $PF_PID 2>/dev/null || true
